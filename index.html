<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una invitación para ti</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

<div class="contenedor">

    <div class="tarjeta" id="pregunta">

        <img src="imagenes/gato-feria.png" class="imagen-principal" alt="Gatito en la feria">

        <h1>¿Vamos a la feria?</h1>

        <p>
            Vamos a la feria de Jocotenango, a que sí hay espiropapas
            y busquemos unas sin aceite para que no te de ansiedad.
        </p>

        <p class="pregunta">
            ¿Te apuntas?
        </p>

        <div class="botones">

            <button id="si">
                Sí 👀
            </button>

            <button id="no">
                No
            </button>

        </div>

    </div>


    <div class="tarjeta oculto" id="respuesta">

        <img src="imagenes/gato-flor.jpg" class="imagen-final" alt="Gatito con flor">

        <h1>Entonces sí vamos 👀</h1>

        <p>
            Va pues, vamos a dar una vuelta por la feria de Jocotenango
            y a buscar espiropapas.
        </p>

        <div class="comida">
            🎡 🍟 🌷
        </div>

        <p class="final">
            Y florcita para ti.
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
